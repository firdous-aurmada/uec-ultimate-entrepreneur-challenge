<meta charset="utf-8">
<title>UEC golden images</title>
<style>
  body { background: #0b0e1a; color: #eef1ff; font: 14px ui-monospace, monospace; padding: 16px; }
  #out { white-space: pre; line-height: 1.5; }
  .ok { color: #57ff8a; } .bad { color: #ff3d6e; }
  button { font: inherit; padding: 6px 14px; margin-right: 8px; }
</style>
<button id="check">CHECK against baseline</button>
<button id="isolate">CHECK isolation (big bodies first)</button>
<button id="write">WRITE new baseline</button>
<div id="out">ready</div>
<canvas id="c" width="360" height="380" style="display:none"></canvas>
<script type="module">
import { FIGHTERS } from '../../src/data/fighters.js';
import { drawFighter } from '../../src/engine/drawFighter.js';
import { ATTACKS } from '../../src/config.js';
import { clampBody } from '../../src/engine/proportions.js';
import { hashPixels, CASES } from './hash.js';

const out = document.getElementById('out');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

// Three Math.random() calls sit in the render/update path — hit jitter in
// drawFighter, the unicorn sparkle and the rush spark in fighter.js. Without
// pinning, baselines never reproduce.
const realRandom = Math.random;

// computePose only reads plain fields, so a stub object is enough — no Game
// instance, no controller, no audio.
function stubFighter(def, c) {
  return {
    def, side: 0, x: 180, y: 330, facing: 1,
    state: c.state, stateT: c.stateT ?? 0, walkPhase: c.walkPhase ?? 0,
    airborne: !!c.airborne, crouching: !!c.crouching, movingBack: false,
    unicornT: 0, flashT: 0,
    attack: c.kind ? { ...ATTACKS[c.kind], kind: c.kind, hasHit: false } : null,
  };
}

function keyFor(def, c) {
  return `${def.id}/${c.state}${c.kind ? ':' + c.kind : ''}@${c.t}`;
}

function capture() {
  const result = {};
  Math.random = () => 0.5;
  try {
    for (const def of FIGHTERS) {
      for (const c of CASES) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawFighter(ctx, stubFighter(def, c), c.t);
        const px = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        result[keyFor(def, c)] = hashPixels(px);
      }
    }
  } finally {
    Math.random = realRandom;
  }
  return result;
}

// Exposed so the controller can drive this headlessly instead of clicking.
window.captureGolden = capture;
window.checkGolden = async () => {
  const current = capture();
  const baseline = await fetch('./baseline.json?' + Date.now()).then(r => r.json());
  const keys = [...new Set([...Object.keys(baseline), ...Object.keys(current)])].sort();
  const bad = keys.filter(k => baseline[k] !== current[k]);
  return { total: keys.length, bad, detail: bad.map(k => `${k}: ${baseline[k] ?? '(new)'} → ${current[k] ?? '(gone)'}`) };
};

document.getElementById('check').onclick = async () => {
  const r = await window.checkGolden();
  out.innerHTML = `<span class="${r.bad.length ? 'bad' : 'ok'}">${r.bad.length ? r.bad.length + ' MISMATCH of ' + r.total : 'ALL ' + r.total + ' MATCH'}</span>\n\n`
    + r.detail.join('\n');
};

// Renders extreme bodies first, then re-checks the neutral roster.
//
// This exists because of a real bug: the shading buffer used to be shared and
// grow-only, so once a big-bodied character rendered, every OTHER character's
// shading shifted very slightly — a fighter's look depended on who else was on
// screen. Plain CHECK could never catch it, because no shipped character has a
// non-neutral body yet. This makes the isolation a standing guarantee.
window.checkIsolation = async () => {
  const cv = document.createElement('canvas');
  cv.width = 600; cv.height = 600;
  const cx = cv.getContext('2d');
  const bodies = [
    { height: 1.22, build: 1.25, reach: 1.20, stride: 1.18, shoulders: 1.25, head: 1.12 },
    { height: 0.82, build: 0.85, reach: 0.88, stride: 0.88, shoulders: 0.85, head: 0.90 },
    { height: 1.10, build: 1.00, reach: 1.15, stride: 1.05, shoulders: 1.00, head: 1.00 },
  ];
  for (const body of bodies) {
    drawFighter(cx, { ...stubFighter(FIGHTERS[0], { state: 'idle' }), body: clampBody(body), x: 300, y: 500 }, 0.5);
  }
  return window.checkGolden();
};

document.getElementById('isolate').onclick = async () => {
  const r = await window.checkIsolation();
  out.innerHTML = `<span class="${r.bad.length ? 'bad' : 'ok'}">${r.bad.length
    ? r.bad.length + ' MISMATCH of ' + r.total + ' after big bodies rendered — buffers are leaking between characters'
    : 'ISOLATED — all ' + r.total + ' still match after extreme bodies rendered'}</span>\n\n`
    + r.detail.join('\n');
};

document.getElementById('write').onclick = async () => {
  const body = JSON.stringify(capture(), null, 2);
  const res = await fetch('./baseline.json', { method: 'PUT', body });
  out.textContent = res.ok ? 'baseline written — commit it' : 'PUT failed: run under dev-server.py';
};
</script>
